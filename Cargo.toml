[package]
name = "data-inspector"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std" ] }
uuid = { version = "1", features = ["v4"] }